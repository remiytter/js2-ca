<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="See the latest posts on JSocial">
    <title>Feed | JSocial</title>
    <link rel="stylesheet" href="./css/style.css">
  </head>

  <body>
    <header class="site-header">
      <a class="logo" href="./index.html">JSocial</a>

      <nav aria-label="Main navigation">
        <a href="./index.html" aria-current="page">Feed</a>
        <a href="./create.html">Create post</a>
        <button id="logout-button" type="button">Log out</button>

    </header>

    <main class="feed-container">

      <p id="feed-message" role="status"></p>

      <div id="posts-container"></div>

      <button id="load-more-button" type="button" hidden>
        Load more
      </button>
    </main>

    <script type="module" src="./js/pages/feed.js"></script>
  </body>
</html>
