<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View a profile and posts on JSocial">
    <title>Profile | JSocial</title>
    <link rel="stylesheet" href="./css/style.css">
  </head>

  <body>
    <header class="site-header">
      <a class="logo" href="./index.html">JSocial</a>

      <nav aria-label="Main navigation">
        <a href="./index.html">Feed</a>
        <a href="./create.html">Create post</a>
        <a href="./profile.html">My profile</a>
      </nav>
    </header>

    <main class="feed-container">
      <p id="profile-message" role="status"></p>

      <section id="profile-container" hidden>
        <h1 id="profile-name"></h1>
        <p id="profile-bio"></p>
        <p id="profile-stats"></p>
      </section>

      <section id="profile-posts-section" hidden>
        <h2>Posts</h2>

        <p id="posts-message" role="status"></p>
        <div id="posts-container"></div>

        <button id="load-more-button" type="button" hidden>
          Load more
        </button>
      </section>
    </main>

    <script type="module" src="./js/pages/profile.js"></script>
  </body>
</html>
