<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Log in to your JSocial account">
        <title>Log in | JSocial</title>
        <link rel="stylesheet" href="./css/style.css">
    </head>
    <body>
        <header class="site-header">
            <a class="logo" href="./login.html">JSocial</a>

            <nav aria-label="Main-navigation">
                <a href="./login.html" aria-current="page">Log in</a>
                <a href="./register.html">Register</a>
            </nav>
        </header>

        <main class="auth-container">
            <h1>Welcome back</h1>
            <p>Log in to see the latest posts.</p>

            <form id="login-form" method="post">
                <div class="form-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <p id="form-message" role="status"></p>

                <button type="submit" disabled>Log in</button>
            </form>

            <p>New here? <a href="./register.html">Create an account</a></p>
        </main>
        <script type="module" src="./js/pages/login.js"></script>
    </body>
</html>
