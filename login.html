<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Log in to your JSocial account">
        <title>Log in | JSocial</title>
        <link rel="stylesheet" href="./css/main.css">
    </head>
    <body>
  <header class="bg-white border-bottom">
    <nav
      class="container d-flex flex-wrap justify-content-between align-items-center gap-3 py-3"
      aria-label="Main navigation">
      <a
        class="fs-4 fw-bold text-decoration-none"
        href="./login.html">
        JSocial
      </a>

      <div class="d-flex gap-3">
        <a
          class="fw-bold"
          href="./login.html"
          aria-current="page">
          Log in
        </a>
        <a href="./register.html">Register</a>
      </div>
    </nav>
  </header>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-5">
        <section
          class="card bg-white border-0 shadow-sm"
          aria-labelledby="login-heading">
          <div class="card-body p-4">
            <h1 id="login-heading" class="h2">Welcome back</h1>
            <p class="text-body-secondary mb-4">
              Log in to see the latest posts.
            </p>

            <form id="login-form" method="post">
              <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input
                  class="form-control"
                  type="email"
                  id="email"
                  name="email"
                  autocomplete="username"
                  required>
              </div>

              <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input
                  class="form-control"
                  type="password"
                  id="password"
                  name="password"
                  autocomplete="current-password"
                  required>
              </div>

              <p
                id="form-message"
                class="small text-body-secondary"
                role="status">
              </p>

              <button
                class="btn btn-primary w-100"
                type="submit"
                disabled>
                Log in
              </button>
            </form>

            <p class="mt-4 mb-0">
              New here?
              <a href="./register.html">Create an account</a>
            </p>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script type="module" src="./js/pages/login.js"></script>
</body>
</html>
